<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카트모아 - 통합 장바구니 비교</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card {
            margin-bottom: 1rem;
        }
        .product-image {
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">카트모아</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/cart">장바구니</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">상품 URL 추가</h5>
                        <form th:action="@{/cart/add}" method="post">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" name="productUrl" placeholder="상품 URL을 입력하세요" required>
                                <button class="btn btn-primary" type="submit">추가</button>
                            </div>
                        </form>
                        <p class="text-muted">지원하는 쇼핑몰: 쿠팡, 네이버쇼핑, 11번가</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-8 offset-md-2">
                <h4>최근 추가된 상품</h4>
                <div class="row">
                    <div th:each="item : ${items}" class="col-md-4">
                        <div class="card product-card">
                            <img th:src="${item.imageUrl}" class="card-img-top product-image" alt="상품 이미지">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${item.productName}">상품명</h5>
                                <p class="card-text">
                                    <span th:text="${item.price} + '원'">가격</span><br>
                                    <small class="text-muted" th:text="${item.storeName}">판매처</small>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
