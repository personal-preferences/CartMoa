<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공유된 장바구니 - 카트모아</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-image {
            height: 100px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">카트모아</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:unless="${error}">
            <div class="row">
                <div class="col-md-12">
                    <h2>공유된 장바구니</h2>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>상품 이미지</th>
                                    <th>상품명</th>
                                    <th>가격</th>
                                    <th>배송비</th>
                                    <th>판매처</th>
                                    <th>원본 링크</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td>
                                        <img th:src="${item.imageUrl}" class="product-image" alt="상품 이미지">
                                    </td>
                                    <td th:text="${item.productName}">상품명</td>
                                    <td th:text="${item.price} + '원'">가격</td>
                                    <td th:text="${item.shippingCost}">배송비</td>
                                    <td th:text="${item.storeName}">판매처</td>
                                    <td>
                                        <a th:href="${item.productUrl}" target="_blank">상품 페이지</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title">총 예상 금액</h5>
                            <p class="card-text">
                                상품 가격 합계: <span th:text="${totalPrice} + '원'">0원</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
