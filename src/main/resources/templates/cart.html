<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니 - 카트모아</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-image {
            height: 100px;
            object-fit: contain;
        }
        .alert {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">카트모아</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/cart">장바구니</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${shareUrl}" class="alert alert-info">
            공유 링크: <a th:href="${shareUrl}" th:text="${shareUrl}"></a>
        </div>

        <div class="row">
            <div class="col-md-12">
                <h2>장바구니</h2>
                <div th:if="${items.empty}" class="alert alert-info">
                    장바구니가 비어 있습니다.
                </div>
                <div th:unless="${items.empty}">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>상품 이미지</th>
                                    <th>상품명</th>
                                    <th>가격</th>
                                    <th>배송비</th>
                                    <th>판매처</th>
                                    <th>원본 링크</th>
                                    <th>삭제</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td>
                                        <img th:src="${item.imageUrl}" class="product-image" alt="상품 이미지">
                                    </td>
                                    <td th:text="${item.productName}">상품명</td>
                                    <td th:text="${item.price} + '원'">가격</td>
                                    <td th:text="${item.shippingCost}">배송비</td>
                                    <td th:text="${item.storeName}">판매처</td>
                                    <td>
                                        <a th:href="${item.productUrl}" target="_blank">상품 페이지</a>
                                    </td>
                                    <td>
                                        <form th:action="@{/cart/remove}" method="post">
                                            <input type="hidden" name="itemId" th:value="${item.id}">
                                            <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title">총 예상 금액</h5>
                            <p class="card-text">
                                상품 가격 합계: <span th:text="${totalPrice} + '원'">0원</span>
                            </p>
                        </div>
                    </div>

                    <div class="mt-4">
                        <form th:action="@{/cart/share}" method="post">
                            <button type="submit" class="btn btn-primary">장바구니 공유하기</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
